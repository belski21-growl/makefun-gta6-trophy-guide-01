<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121719">
  <title>Leonida Ledger | GTA VI Trophy Guide</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="mast">
    <div class="brand"><span class="monogram" aria-hidden="true">VI</span><div><h1>Leonida Ledger</h1><p>Grand Theft Auto VI · PlayStation 5</p></div></div>
    <section class="progress-panel" aria-label="Trophy progress">
      <div class="progress-line"><strong id="total"></strong><progress id="progress" aria-label="Trophies earned" max="55" value="0"></progress><span id="percent"></span></div>
      <div id="grade-counts"></div><span id="progress-caption" class="sr-only"></span>
    </section>
    <div class="backup">
      <label class="shield"><input type="checkbox" id="spoilers" checked> Spoiler shield</label>
      <button id="export" type="button">↓ Export</button><button id="import" type="button">↑ Import</button>
      <input id="import-file" type="file" accept="application/json,.json" hidden>
      <span id="save-trace"></span>
    </div>
  </header>
  <main>
    <section class="audit" aria-label="Trophy data audit"><strong>AUDIT</strong><div id="audit-counts"></div><span class="zero">● Zero network</span></section>
    <nav class="tabs" aria-label="Guide views">
      <button data-view="tracker" class="active" aria-current="page">Tracker</button>
      <button data-view="roadmap">Roadmap</button>
      <button data-view="missables">Missables</button>
      <button data-view="spoilers">Story &amp; spoilers</button>
    </nav>
    <h2 id="view-heading" class="sr-only">Trophy tracker</h2>
    <p id="status" role="status"></p>
    <section id="tracker-view" aria-labelledby="view-heading">
      <div class="tools">
        <div id="filters" role="group" aria-label="Trophy category"></div>
        <div class="search-tools"><label><input id="search" type="search" placeholder="Search trophies" aria-label="Search trophies"></label><label><input id="remaining" type="checkbox"> Unearned</label></div>
      </div>
      <div class="dashboard">
        <section class="checklist" aria-label="Trophy checklist">
          <div class="panel-title"><strong>CHECKLIST</strong><span id="result-count"></span></div>
          <div id="trophy-list"></div>
        </section>
        <article id="detail" class="detail" tabindex="-1" aria-label="Selected trophy guide"></article>
        <aside class="rail" aria-label="Recommendations and sources">
          <section class="next-panel"><div class="panel-title"><strong>NEXT UP</strong><span>Roadmap order</span></div><div id="next-up"></div></section>
          <section class="source-panel"><div class="panel-title"><strong>SOURCES</strong><span id="source-count"></span></div><div id="sources"></div></section>
        </aside>
      </div>
    </section>
    <section id="roadmap-view" hidden aria-labelledby="view-heading">
      <div class="route-layout">
        <div id="route-stages"></div>
        <aside class="watch-panel"><h3>Before you advance</h3><div id="watch-list"></div></aside>
      </div>
    </section>
    <section id="missables-view" hidden aria-labelledby="view-heading"><div id="missable-list" class="watch-grid"></div></section>
    <section id="spoiler-view" hidden aria-labelledby="view-heading"><div id="spoiler-list" class="watch-grid"></div></section>
    <footer><span>Independent GTA VI trophy guide</span><span id="points"></span></footer>
  </main>
  <noscript>This tracker requires JavaScript to read the local trophy file.</noscript>
</body>
</html>
